# Runs the API tests and the browser tests on every pull request and on pushes to main.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the server itself has no dependencies; Playwright is only for these tests
      - run: npm i --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_SHOTS: e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots
          path: e2e-shots
          if-no-files-found: ignore
